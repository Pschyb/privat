name: ROS 2 Humble

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MPLCONFIGDIR: /tmp/matplotlib
      ROS_DISTRO: humble
    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      # Current Humble Debian packages can install Python modules below
      # /opt/ros/humble/local without exporting that directory.  Add both
      # supported install layouts before the native colcon build and tests.
      - name: Configure ROS 2 Humble Python path
        shell: bash
        run: |
          python_version="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          ros_python_paths="/opt/ros/humble/local/lib/python${python_version}/dist-packages:/opt/ros/humble/lib/python${python_version}/site-packages"
          if [[ -n "${PYTHONPATH:-}" ]]; then
            ros_python_paths="${ros_python_paths}:${PYTHONPATH}"
          fi
          echo "PYTHONPATH=${ros_python_paths}" >> "${GITHUB_ENV}"
          PYTHONPATH="${ros_python_paths}" python3 -c 'import ament_cmake_test'

      - name: Install pinned Python dependencies
        run: python3 -m pip install --user -r requirements-humble.txt

      - name: Build and test the package
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          set -u

          test "${ROS_DISTRO}" = "humble"
          test -f /opt/ros/humble/share/ament_index/resource_index/rosidl_typesupport_c/rosidl_typesupport_fastrtps_c
          python3 -c 'import rosidl_cmake'

          if [[ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]]; then
            sudo rosdep init
          fi
          rosdep update --rosdistro humble
          rosdep install --from-paths . --ignore-src --rosdistro humble -r -y
          colcon build --symlink-install --packages-select rose2 --event-handlers console_cohesion+
          colcon test --packages-select rose2 --event-handlers console_direct+
          colcon test-result --verbose
